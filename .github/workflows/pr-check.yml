  unit-test:
    needs: build-packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.3
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: built-packages
          path: dist
      - name: Test packages
        run: npm run test playground -- -c=production-wp --watch=false
      # TODO: re-enable once ng-add/index.spec.ts is migrated off the removed `run*SchematicAsync` APIs.
      # - name: Test schematics
      #   run: npm run test:schematics
      - name: Upload coverage to codecov
        uses: codecov/codecov-action@5a1091511ad55cbe89839c7260b706298ca349f7
  packages-smoke:
    needs: build-packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.3
      - uses: actions/download-artifact@v4
        with:
          name: built-packages
          path: packages-smoke/.lib/
      - run: npm ci
        working-directory: packages-smoke
      - name: Build
        run: npm run build -- --configuration=production
        working-directory: packages-smoke
      - name: SSR smoke test
        run: |
          PORT=4000 npm run serve:ssr &
          for i in $(seq 1 30); do curl -sf http://localhost:4000/ -o index.html && break; sleep 1; done
          grep -q 'Nebular Works!!!' index.html
        working-directory: packages-smoke
